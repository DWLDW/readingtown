<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readingtown Next</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero card">
        <p class="badge">NEW BRANCH START</p>
        <h1>Readingtown Next</h1>
        <p>기존 내용을 비우고 새롭게 개발을 시작할 수 있는 초기 화면입니다.</p>
      </section>

      <section class="card">
        <h2>개발 로드맵</h2>
        <ul class="roadmap">
          <li>요구사항 정리</li>
          <li>MVP 화면 설계</li>
          <li>핵심 데이터 모델 정의</li>
          <li>기능 단위 구현</li>
        </ul>
      </section>

      <section class="card">
        <h2>이번 브랜치 TODO</h2>
        <form id="todo-form" class="todo-form">
          <input id="todo-input" name="todo" placeholder="예: 로그인 플로우 설계" required />
          <button type="submit">추가</button>
        </form>
        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
